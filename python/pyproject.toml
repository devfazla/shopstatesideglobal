[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanhtml-statesideglobal"
version = "0.1.0"
description = "Convert an HTML string into clean Markdown. Behaviour-identical to the Go and JS statesideglobal clean-html ports."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Stateside Global" }]
keywords = ["html", "markdown", "clean-html", "html-to-markdown", "statesideglobal"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.scripts]
cleanhtml = "cleanhtml.__main__:main"

[project.urls]
Homepage = "https://shopstatesideglobal.com"
Repository = "https://github.com/devfazla/shopstatesideglobal"

[tool.setuptools]
packages = ["cleanhtml"]
